<!DOCTYPE html><html><head><meta charset="utf-8"><title>JarvisPrimez</title>
<style>
:root{--c:#00e5ff;--bg:#050a18;--p:#0c1630;--t:#e6f1ff;--m:#7f93b8}
*{box-sizing:border-box;margin:0}body{font-family:Segoe UI,system-ui,sans-serif;background:radial-gradient(circle at 50% 0,#0d1f4a,var(--bg) 60%);color:var(--t);height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid #16284f}
header h1{font-size:20px;letter-spacing:3px;font-weight:600}header span{color:var(--c)}
#st{margin-left:auto;font-size:13px;color:var(--m)}
main{flex:1;display:flex;gap:20px;padding:20px 24px;min-height:0}
.left{width:300px;display:flex;flex-direction:column;align-items:center;gap:16px}
.orb{width:170px;height:170px;border-radius:50%;margin-top:10px;background:radial-gradient(circle,#00e5ff 0,#0096ff 45%,#5a3cff 100%);box-shadow:0 0 50px #00b8ff88;opacity:.45;transition:.3s}
.orb.on{opacity:1;animation:p 1.6s infinite}.orb.talk{animation:p .5s infinite}
@keyframes p{50%{transform:scale(1.09);box-shadow:0 0 90px #00e5ffcc}}
.card{background:var(--p);border:1px solid #16284f;border-radius:12px;padding:14px;width:100%;font-size:13px;color:var(--m)}
.card label{display:block;margin:8px 0 3px}select,input[type=text],input[type=password],input[type=range]{width:100%}
select,input[type=text],input[type=password]{background:#08122a;color:var(--t);border:1px solid #1d3466;border-radius:8px;padding:8px}
button{background:linear-gradient(90deg,#0096ff,#00e5ff);color:#021;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
button.g{background:#122552;color:var(--t)}
.right{flex:1;display:flex;flex-direction:column;min-width:0}
#log{flex:1;overflow:auto;background:var(--p);border:1px solid #16284f;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:80%;padding:10px 14px;border-radius:12px;line-height:1.5;font-size:14px;white-space:pre-wrap}
.u{align-self:flex-end;background:#12306b}.j{align-self:flex-start;background:#0a2347;border:1px solid #17407e}
.row{display:flex;gap:10px;margin-top:12px}.row input{flex:1}
footer{text-align:center;padding:10px;font-size:12px;color:var(--m);border-top:1px solid #16284f}footer b{color:var(--c)}
#ov{position:fixed;inset:0;background:#050a18f2;display:flex;align-items:center;justify-content:center;z-index:9}
#ov .box{background:var(--p);border:1px solid #1d3466;border-radius:16px;padding:30px;width:440px;text-align:center}
#ov h2{margin-bottom:8px}#ov p{color:var(--m);font-size:13px;margin-bottom:16px}#ov a{color:var(--c)}
</style></head><body>
<div id="ov"><div class="box"><h2>Welcome to <span style="color:var(--c)">JarvisPrimez</span></h2>
<p>Enter your own Gemini API key. It is stored only on this PC.<br>Get one free at <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a></p>
<input id="k" type="password" placeholder="Paste Gemini API key"><br><br><button onclick="saveKey()">Activate</button></div></div>
<header><svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" fill="none" stroke="#00e5ff" stroke-width="3"/><circle cx="17" cy="17" r="5" fill="#00e5ff"/></svg>
<h1>JARVIS<span>PRIMEZ</span></h1><div id="st">Sleeping — say “jarvisprimez”</div></header>
<main><div class="left"><div class="orb" id="orb"></div>
<button id="mic" onclick="toggleMic()">🎤 Start Listening</button>
<div class="card"><b style="color:var(--t)">Voice</b>
<label>Voice</label><select id="vs"></select>
<label>Speed</label><input id="rt" type="range" min=".6" max="1.6" step=".1" value="1">
<label>Pitch</label><input id="pt" type="range" min=".5" max="1.8" step=".1" value="1">
<br><br><button class="g" onclick="speak('Hello, I am Jarvis Primez, at your service.')">Test voice</button>
<button class="g" onclick="resetKey()" style="margin-top:6px">Change API key</button></div></div>
<div class="right"><div id="log"></div>
<div class="row"><input id="in" type="text" placeholder="Type a message…" onkeydown="if(event.key==='Enter')send()"><button onclick="send()">Send</button></div></div></main>
<footer>Made by <b>Amitanshu</b> • JarvisPrimez v1.0</footer>
<script>
const $=id=>document.getElementById(id),MODEL='gemini-2.5-flash',WAKE=['jarvisprimez','jarvisprimes','jarvisprimaz','jarvisprime'];
let KEY=localStorage.getItem('jp_key')||'',awake=false,speaking=false,busy=false,hist=[],stream,listening=false,idle;
const SYS='You are JarvisPrimez, a smart, polite voice assistant created by Amitanshu. Keep answers short and conversational (1-3 sentences) unless asked for detail. No markdown.';
if(KEY)$('ov').style.display='none';
function saveKey(){const v=$('k').value.trim();if(!v)return;KEY=v;localStorage.setItem('jp_key',v);$('ov').style.display='none'}
function resetKey(){localStorage.removeItem('jp_key');KEY='';$('ov').style.display='flex'}
function add(c,t){const d=document.createElement('div');d.className='m '+c;d.textContent=t;$('log').appendChild(d);$('log').scrollTop=1e9}
function st(t){$('st').textContent=t}
async function gem(contents){const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':KEY},body:JSON.stringify({system_instruction:{parts:[{text:SYS}]},contents})});const j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);return(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').trim()}
function voices(){const v=speechSynthesis.getVoices();$('vs').innerHTML=v.map((x,i)=>`<option value="${i}">${x.name} (${x.lang})</option>`).join('');const s=localStorage.getItem('jp_voice');if(s)$('vs').value=s}
speechSynthesis.onvoiceschanged=voices;voices();$('vs').onchange=()=>localStorage.setItem('jp_voice',$('vs').value);
function speak(t){return new Promise(res=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t),v=speechSynthesis.getVoices()[$('vs').value];if(v)u.voice=v;u.rate=+$('rt').value;u.pitch=+$('pt').value;speaking=true;$('orb').classList.add('talk');u.onend=u.onerror=()=>{speaking=false;$('orb').classList.remove('talk');res()};speechSynthesis.speak(u)})}
function wake(on){awake=on;$('orb').classList.toggle('on',on);st(on?'Awake — listening':'Sleeping — say “jarvisprimez”');clearTimeout(idle);if(on)idle=setTimeout(()=>wake(false),120000)}
async function send(){const t=$('in').value.trim();if(!t)return;$('in').value='';await handle(t,true)}
async function handle(t,typed){add('u',t);const n=t.toLowerCase().replace(/[^a-z ]/g,'');if(/go to sleep|sleep now/.test(n)){wake(false);add('j','Going to sleep.');return speak('Going to sleep.')}
if(typed)wake(true);hist.push({role:'user',parts:[{text:t}]});st('Thinking…');
try{const a=await gem(hist.slice(-20));hist.push({role:'model',parts:[{text:a}]});add('j',a);st('Speaking…');await speak(a)}catch(e){add('j','Error: '+e.message);hist.pop()}
wake(true)}
async function onAudio(blob){if(busy)return;busy=true;try{const b64=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(blob)});
const tr=await gem([{role:'user',parts:[{inline_data:{mime_type:'audio/webm',data:b64}},{text:'Transcribe this audio verbatim. Output only the transcript, nothing else. If there is no clear speech output nothing.'}]}]);
if(!tr)return;const flat=tr.toLowerCase().replace(/[^a-z]/g,'');
if(!awake){if(WAKE.some(w=>flat.includes(w))){wake(true);add('j','Online. How can I help?');await speak('Online. How can I help you?')}}
else await handle(tr,false)}catch(e){st('Error: '+e.message.slice(0,60))}finally{busy=false}}
async function toggleMic(){if(listening){listening=false;stream.getTracks().forEach(t=>t.stop());$('mic').textContent='🎤 Start Listening';st('Mic off');return}
try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){return st('Mic permission denied')}
listening=true;$('mic').textContent='⏹ Stop Listening';wake(awake);
const ac=new AudioContext(),an=ac.createAnalyser();an.fftSize=1024;ac.createMediaStreamSource(stream).connect(an);const buf=new Uint8Array(an.fftSize);
let rec=null,chunks=[],last=0,start=0;
const tick=()=>{if(!listening){ac.close();return}an.getByteTimeDomainData(buf);let s=0;for(const v of buf)s+=Math.abs(v-128);const lvl=s/buf.length,now=Date.now();
if(!speaking&&!busy&&lvl>4){last=now;if(!rec){chunks=[];rec=new MediaRecorder(stream,{mimeType:'audio/webm'});rec.ondataavailable=e=>chunks.push(e.data);const r=rec;rec.onstop=()=>{if(Date.now()-start>700)onAudio(new Blob(chunks,{type:'audio/webm'}))};rec.start();start=now}}
if(rec&&(now-last>1300||now-start>20000)){rec.stop();rec=null}requestAnimationFrame(tick)};tick()}
</script></body></html>
